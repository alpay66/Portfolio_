<div class="overlay" (click)="handleOverlayClick()">
    <div class="overlay-background" [class.active]="menuOpen" (click)="toggleMenu()">
        <div class="overlay-content" (click)="$event.stopPropagation()">
            <p class="close-btn-container">
                <a class="close-btn" (click)="close()"> <img src="/img/go-back-arrow.png" alt="">Go Back</a>
            </p>

            <app-header-bar></app-header-bar>
            <div class="burger-menu-mobile">
                <img class="logo" src="/img/AK_logo.png" alt="AK_logo">
                <img class="burger-menu-img" (click)="toggleMenu()" src="/img/hero-burger-menu-logo.svg" alt="menu" />
            </div>

            <div class="overlay-container">
                <div class="left-side">
                    <h1>{{ project.title }}</h1>
                    <h3>Beschreibung</h3>
                    <p>{{ project.description }}</p>

                    <h3>Implementierungsdetails</h3>
                    <p>
                        {{project.details}}
                    </p>

                    <p>Dauer: {{project.duration}}</p>

                    <div class="left-side-skills">
                        <div *ngFor="let skill of project.skills">
                            <img [src]="'/img/' + skill.toLowerCase() + '.png'" [alt]="skill" width="30" height="30">
                            <p>{{ skill.toUpperCase() }}</p>
                        </div>
                    </div>
                </div>

                <div class="right-side">
                    <div class="right-side-image-container">
                        <img class="right-side-image" [src]="project.image" [alt]="project.title">
                    </div>

                    <div class="right-side-buttons">

                        <a [href]="project.githubLink" target="_blank">
                            <button>GitHub</button>
                        </a>

                        <a [href]="project.liveLink" target="_blank">
                            <button>Live Test</button>
                        </a>
                    </div>

                    <div class="right-side-next-button">
                        <a class="close-btn-mobile" (click)="close()">
                            <img src="/img/go-back-arrow.png" alt="">Geh zurück
                        </a>

                        <a class="next-project" (click)="next()">Nächstes Projekt<img src="/img/next-project.png">
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="mobile-overlay" [class.active]="menuOpen">
        <div class="overlay-header">
            <img src="/img/AK_logo.png" class="logo" />
            <img class="close-icon" (click)="toggleMenu()" src="/img/close-overlay.png" alt="close">
        </div>

        <div class="overlay-nav-container">
            <nav class="overlay-nav">
                <a href="#">About me</a>
                <a href="#">Skills</a>
                <a href="#">Projects</a>
                <a href="#">Contact</a>
            </nav>
        </div>


        <div class="language-switch">
            <span class="lang">EN</span>
            <label class="switch">
                <input type="checkbox" id="langToggle">
                <span class="slider"></span>
            </label>
            <span class="lang">DE</span>
        </div>

        <div class="linked-up-buttons-overlay">
            <div class="circle-button">
                <img src="/img/hero_linked_in.png" alt="LinkedIn">
            </div>

            <div class="circle-button">
                <img src="/img/hero_github.png" alt="GitHub">
            </div>

            <div class="circle-button">
                <img src="/img/hero_mail.png" alt="Mail">
            </div>
        </div>
    </div>
