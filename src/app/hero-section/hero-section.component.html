<section class="hero-section">
    <app-header-bar class="header-bar"></app-header-bar>
    <div class="burger-menu" (click)="toggleMenu()">
        <img class="logo" src="/img/AK_logo.png" alt="AK_logo">
        <img class="burger-menu-img" src="/img/hero-burger-menu-logo.svg" alt="menu" />
    </div>

    <div class="container">
        <div class="hero-content">
            <div class="hero-left">
                <button class="reveal-button" [class.active]="isNameRevealed" (mouseenter)="isNameRevealed = true"
                    (mouseleave)="isNameRevealed = false">
                    <span class="default-text" *ngIf="!isNameRevealed">{{ texts[currentLang()].helloWorld }}</span>
                    <span class="hover-text" *ngIf="isNameRevealed">{{ texts[currentLang()].name }} <span
                            class="wave"></span></span>
                    <span class="hand-track">
                        <span class="hand">
                            <img src="/img/waving_hand_hero.png" alt="👋" />
                        </span>
                    </span>
                </button>
                <div class="frontend-img-row">
                    <h1 class="hover-word">
                        <span class="hover-span letter-frontend-{{i}}" *ngFor="let letter of frontend; let i = index"
                            (mouseenter)="hoveredFrontendIndex = i" (mouseleave)="hoveredFrontendIndex = null"
                            [ngStyle]="{
    color: hoveredFrontendIndex === i ? 'yellow' : 'white',
    textTransform: hoveredFrontendIndex === i 
        ? (i === 0 ? 'lowercase' : 'uppercase') 
        : (i === 0 ? 'uppercase' : 'lowercase')
    }">
                            {{ letter.lower }}
                        </span>
                    </h1>

                    <div class="frontend-img desktop-only">
                        <img class="rotate-img" src="/img/alpay_portfolio_foto.jpg">
                    </div>
                </div>
            </div>

            <div class="hero-right">
                <h1 class="hover-word">
                    <span class="hover-span letter-developer-{{i}}" *ngFor="let letter of developer; let i = index"
                        (mouseenter)="hoveredDeveloperIndex = i" (mouseleave)="hoveredDeveloperIndex = null" [ngStyle]="{
    color: hoveredDeveloperIndex === i ? 'yellow' : 'white',
    textTransform: hoveredDeveloperIndex === i 
        ? (i === 0 ? 'lowercase' : 'uppercase') 
        : (i === 0 ? 'uppercase' : 'lowercase')
    }">
                        {{ letter.lower }}
                    </span>
                </h1>

                <a href="#contact" class="get-in-touch-btn">{{ texts[currentLang()].getInTouch }}</a>
            </div>
            <div class="frontend-img mobile-only">
                <img class="rotate-img" src="/img/alpay_portfolio_foto.jpg">
            </div>
        </div>


        <div class="linked-up-buttons">
            <div class="circle-button">
                <a href="https://www.linkedin.com/feed/" target="_blank">
                    <img src="/img/hero_linked_in.png" alt="LinkedIn">
                </a>
            </div>
            <div class="circle-button">
                <a href="https://github.com/alpay66" target="_blank">
                    <img src="/img/hero_github.png" alt="GitHub">
                </a>
            </div>
            <div class="circle-button">
                <a href="mailto:alpay.karacabey@hotmail.com">
                    <img src="/img/hero_mail.png" alt="Mail">
                </a>
            </div>
        </div>


    </div>
</section>

<div class="mobile-overlay" [class.active]="menuOpen">
    <div class="overlay-header">
        <img src="/img/AK_logo.png" class="logo" />
        <img class="close-icon" (click)="toggleMenu()" src="/img/close-overlay.png" alt="close">
    </div>

    <div class="overlay-nav-container">
        <nav class="overlay-nav">
            <a href="#about" (click)="toggleMenu()">{{ texts[currentLang()].about }}</a>
            <a href="#skills" (click)="toggleMenu()">{{ texts[currentLang()].skills }}</a>
            <a href="#projects" (click)="toggleMenu()">{{ texts[currentLang()].projects }}</a>
            <a href="#contact" (click)="toggleMenu()">{{ texts[currentLang()].contact }}</a>
        </nav>

    </div>


    <div class="language-switch">
        <span class="lang en">EN</span>
        <label class="switch">
            <input type="checkbox" (change)="switchLanguage()" [checked]="currentLang() === 'en'">
            <span class="slider"></span>
        </label>
        <span class="lang de">DE</span>
    </div>


    <div class="linked-up-buttons-overlay">
        <div class="circle-button">
            <a href="https://www.linkedin.com/feed/">
                <img src="/img/hero_linked_in.png" alt="LinkedIn">
            </a>
        </div>

        <div class="circle-button">
            <a href="https://github.com/alpay66" target="_blank">
                <img src="/img/hero_github.png" alt="GitHub">
            </a>
        </div>

        <div class="circle-button">
            <a href="mailto:alpay.karacabey@hotmail.com">
                <img src="/img/hero_mail.png" alt="Mail">
            </a>
        </div>
    </div>
</div>
